[package]
name = "egui_xterm_pty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/egui_xterm_pty"
description = "Cross-platform PTY backend for egui_xterm (desktop portable-pty and wasm32 WebSocket PTY)"
keywords = ["terminal", "pty", "conpty", "websocket", "wasm"]
categories = ["emulators", "os", "wasm"]

[lints]
workspace = true

[dependencies]
egui_xterm_core = { workspace = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
portable-pty = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "MessageEvent",
    "WebSocket",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "pty_transport"
harness = false
