[workspace]
resolver = "2"
members = [
    "crates/egui_xterm_core",
    "crates/egui_xterm",
    "crates/egui_xterm_pty",
    "crates/egui_xterm_e2e",
    "examples/egui_xterm_demo",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AnlangA/egui_xterm"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"

[workspace.dependencies]
# Internal workspace crates
egui_xterm_core = { path = "crates/egui_xterm_core", version = "0.2.0", default-features = false }
egui_xterm = { path = "crates/egui_xterm", version = "0.2.0", default-features = false }
egui_xterm_pty = { path = "crates/egui_xterm_pty", version = "0.2.0" }

# Core / pure-Rust dependencies (WASM-safe)
memchr = "2.8"
unicode-width = "0.2"
unicode-segmentation = "1.13"
bitflags = { version = "2.13", default-features = false }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }

# GUI / egui 0.37 ecosystem
egui = { version = "0.37", default-features = false }
eframe = "0.37"

# Desktop-only native integrations
portable-pty = "0.9"
arboard = "3.7"

# Benchmarking
criterion = "0.8"
