[package]
name = "egui_xterm_demo"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = [
    "search",
    "hyperlinks",
    "shell-integration",
    "kitty-keyboard",
    "kitty-graphics",
    "sixel",
    "vector-glyphs",
    "metrics",
]
search = ["egui_xterm/search"]
hyperlinks = ["egui_xterm/hyperlinks"]
shell-integration = ["egui_xterm/shell-integration"]
kitty-keyboard = ["egui_xterm/kitty-keyboard"]
kitty-graphics = ["egui_xterm/kitty-graphics"]
sixel = ["egui_xterm/sixel"]
vector-glyphs = ["egui_xterm/vector-glyphs"]
metrics = ["egui_xterm/metrics"]
serde = ["egui_xterm/serde"]
inspection = ["eframe/inspection"]

[dependencies]
egui_xterm = { workspace = true, default-features = false, features = ["pty", "native-clipboard"] }
egui = { workspace = true, features = ["default_fonts"] }
eframe = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Location",
    "Window",
    "console",
] }
